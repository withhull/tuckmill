name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      # The llama.cpp reference backend, the pinned shim, and physical-Mac
      # qualification runs are intentionally NOT part of this workflow:
      # the reference library is fetched per developer machine
      # (scripts/fetch-llama.sh) and Metal/performance qualification happens
      # on owned hardware, never in shared CI.
