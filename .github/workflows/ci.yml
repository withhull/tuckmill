name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the repository toolchain (rust-toolchain.toml): the gate
      # must run exactly the rustc/clippy that local development runs.
      # Moving stable previously surfaced lints the local toolchain could
      # not reproduce (run 38910541208). Bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Build the worker binary the isolated-worker tests spawn, then require
      # those tests: a missing prerequisite must fail the gate, never look
      # like a pass. Test labels are explicit — portable tests always run;
      # isolated-worker tests run here mandatorily; real-weight reference
      # tests (pinned llama.cpp library + artifacts) and physical-Mac
      # qualification are separate, machine-local gates.
      - name: build worker binary
        run: cargo build -p tuckmill-cli
      - name: tests
        env:
          TUCKMILL_TEST_WORKER_BIN: ${{ github.workspace }}/target/debug/tuckmill
          TUCKMILL_REQUIRE_ISOLATED_WORKER: "1"
          # The macOS runners expose a Metal GPU (verified in run 39021321957:
          # GPU kernel tests executed, zero skips); a runner without a device
          # must fail the gate, never silently skip the GPU suite.
          TUCKMILL_REQUIRE_METAL: "1"
        run: cargo test --workspace
      # The llama.cpp reference backend, the pinned shim, and physical-Mac
      # qualification runs are intentionally NOT part of this workflow:
      # the reference library is fetched per developer machine
      # (scripts/fetch-llama.sh) and Metal/performance qualification happens
      # on owned hardware, never in shared CI.
